<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>발자국동행 4K 그래픽 배너</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; word-break: keep-all; }
        body { width: 4096px; height: 2304px; overflow: hidden; background: linear-gradient(135deg, #f8f6f0 0%, #ede8de 100%); position: relative; }

        /* 4K 스케일 디자인 아우라 */
        .aura1 { position: absolute; top: -400px; right: -300px; width: 2400px; height: 2400px; background: rgba(2, 132, 199, 0.12); border-radius: 50%; filter: blur(120px); }
        .aura2 { position: absolute; bottom: -300px; right: 400px; width: 1800px; height: 1800px; background: rgba(217, 119, 6, 0.12); border-radius: 50%; filter: blur(120px); }

        .content { position: relative; z-index: 10; padding: 220px 240px; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }

        .badge { display: inline-flex; align-items: center; gap: 20px; background: rgba(2, 132, 199, 0.12); border: 4px solid #0284c7; color: #0284c7; padding: 20px 50px; border-radius: 80px; font-size: 52px; font-weight: 800; width: fit-content; }

        .brand-title { font-size: 210px; font-weight: 900; color: #0f172a; margin-top: 40px; letter-spacing: -4px; line-height: 1.1; }
        .brand-sub { font-size: 88px; font-weight: 800; color: #d97706; margin-top: 20px; }

        .features { display: flex; flex-direction: column; gap: 28px; margin-top: 60px; color: #475569; font-size: 58px; font-weight: 700; }

        .trims-row { display: flex; gap: 40px; margin-top: 60px; }
        .trim-card { padding: 32px 64px; border-radius: 40px; font-size: 52px; font-weight: 800; display: flex; align-items: center; gap: 20px; }
        .trim-red { background: #fef2f2; border: 4px solid #ef4444; color: #dc2626; }
        .trim-yellow { background: #fffbeb; border: 4px solid #f59e0b; color: #b45309; }
        .trim-blue { background: #f0f9ff; border: 4px solid #0284c7; color: #0284c7; }

        .logo-img { position: absolute; right: 280px; top: 480px; width: 1100px; height: 1100px; border-radius: 50%; border: 24px solid #ffffff; box-shadow: 0 40px 100px rgba(0,0,0,0.18); object-fit: cover; }
    </style>
</head>
<body>
    <div class="aura1"></div>
    <div class="aura2"></div>

    <img src="official_logo.png" class="logo-img" alt="발자국동행 로고">

    <div class="content">
        <div>
            <div class="badge">
                <span>🟢</span>
                <span>부산 전 지역 1:1 레이 케어카 실시간 배차</span>
            </div>

            <div class="brand-title">발자국동행</div>
            <div class="brand-sub">반려동물과 함께 걷는 따뜻한 길 🐾</div>

            <div class="features">
                <div>• 1:1 수석 가드 안심 동행 및 1080p 바디캠 라이브 송출</div>
                <div>• 22.5℃ 차내 자동 온습도 제어 & 펫전용 안심 시트</div>
                <div>• 수의사 정밀 진료 리포트 및 펫보험 청구 영수증 수령</div>
            </div>
        </div>

        <div class="trims-row">
            <div class="trim-card trim-red">🚨 긴급 응급 출동 5만</div>
            <div class="trim-card trim-yellow">🚗 미예약 당일이동 3.5만</div>
            <div class="trim-card trim-blue">📅 예약 진료 3만</div>
        </div>
    </div>
</body>
</html>
