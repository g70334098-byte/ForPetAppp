<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>발자국동행 가드 실시간 관제 지도</title>
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
            min-height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #e2e8f0;
        }
        #loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            padding: 4px;
        }
        .leaflet-popup-content {
            margin: 10px 12px;
            line-height: 1.5;
            font-size: 13px;
        }
        .custom-car-badge {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(2,132,199,0.45);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .custom-hosp-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(220,38,38,0.45);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .custom-hosp-badge-regular {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(16,185,129,0.45);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .custom-hosp-badge-special {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(124,58,237,0.45);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .badge-sub {
            background: #ffffff;
            color: #dc2626;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px;
            font-weight: bold;
        }
        .badge-sub-regular {
            background: #ffffff;
            color: #059669;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px;
            font-weight: bold;
        }
        .badge-sub-special {
            background: #ffffff;
            color: #7c3aed;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px;
            font-weight: bold;
        }
        .badge-live {
            background: #10b981;
            color: #ffffff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading-indicator">🗺️ 고화질 관제 지도를 불러오는 중...</div>
    <div id="map"></div>
    <script>
        var map = null;
        var markers = {};
        var carLat = 35.0830000;
        var carLng = 128.8950000;

        function initMapEngine() {
            if (map !== null) return;
            if (typeof L === 'undefined') {
                setTimeout(initMapEngine, 50);
                return;
            }
            var mapElem = document.getElementById('map');
            if (mapElem) {
                var h = window.innerHeight || document.documentElement.clientHeight || 500;
                var w = window.innerWidth || document.documentElement.clientWidth || 360;
                if (!mapElem.style.height || mapElem.clientHeight === 0) {
                    mapElem.style.height = h + 'px';
                    mapElem.style.width = w + 'px';
                }
            }

            try {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([35.150, 128.980], 11);

                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // 관리자 포털과 100% 동일한 Google Maps HD 타일 레이어
                L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20
                }).addTo(map);

                // 1. 레이 케어카 마커 (실시간 GPS 연동)
                var carIcon = L.divIcon({
                    className: '',
                    html: '<div class="custom-car-badge">' +
                          '<span>🚙</span>' +
                          '<span>레이 케어카 (38가 5394)</span>' +
                          '<span class="badge-live">GPS LIVE</span>' +
                          '</div>',
                    iconSize: [190, 36],
                    iconAnchor: [95, 18]
                });
                markers.car = L.marker([carLat, carLng], { icon: carIcon }).addTo(map);
                markers.car.bindPopup(
                    '<div style="min-width:210px;">' +
                    '<b style="font-size:14px;color:#0284c7;">🚙 레이 케어카 (부산 38가 5394)</b><br>' +
                    '👨‍✈️ <b>담당 가드:</b> 박찬헌 가드<br>' +
                    '📍 <b>현재 위치:</b> 실시간 GPS 수신 중<br>' +
                    '⚡ <b>운행 상태:</b> 1:1 안심 진료 대행 이송 중<br>' +
                    '<span style="font-size:11px;color:#64748b;">(위도: ' + carLat.toFixed(6) + ', 경도: ' + carLng.toFixed(6) + ')</span>' +
                    '</div>'
                );

                // 2. 부산 24시 동행동물의료센터 (부산 북구 덕천동 561-2)
                var hosp1Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge">' +
                          '<span>🏥</span>' +
                          '<span>부산 24시 동행</span>' +
                          '<span class="badge-sub">24시 응급</span>' +
                          '</div>',
                    iconSize: [170, 36],
                    iconAnchor: [85, 36]
                });
                markers.hosp1 = L.marker([35.2289650, 129.0093850], { icon: hosp1Icon }).addTo(map);
                markers.hosp1.bindPopup(
                    '<div style="min-width:220px;">' +
                    '<b style="font-size:14px;color:#dc2626;">🏥 부산 24시 동행동물의료센터</b><br>' +
                    '📍 <b>주소:</b> 부산 북구 덕천동 561-2<br>' +
                    '📞 <b>직통:</b> <a href="tel:050714817599" style="color:#0284c7;font-weight:bold;">0507-1481-7599 (전화걸기)</a><br>' +
                    '🩺 <b>진료:</b> 내과, 외과, 정형외과, 안과, 24시 응급<br>' +
                    '✨ 입원실, 미용실 완비' +
                    '</div>'
                );

                // 3. 부산 24시 연산동물의료센터 (부산 연제구 연산동 1953-1)
                var hosp2Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge">' +
                          '<span>🏥</span>' +
                          '<span>부산 24시 연산</span>' +
                          '<span class="badge-sub">24시 응급</span>' +
                          '</div>',
                    iconSize: [170, 36],
                    iconAnchor: [85, 36]
                });
                markers.hosp2 = L.marker([35.1818200, 129.0823500], { icon: hosp2Icon }).addTo(map);
                markers.hosp2.bindPopup(
                    '<div style="min-width:220px;">' +
                    '<b style="font-size:14px;color:#dc2626;">🏥 부산 24시 연산동물의료센터</b><br>' +
                    '📍 <b>주소:</b> 부산 연제구 연산동 1953-1<br>' +
                    '📞 <b>직통:</b> <a href="tel:0517910175" style="color:#0284c7;font-weight:bold;">051-791-0175 (전화걸기)</a><br>' +
                    '🩺 <b>진료:</b> 내과, 피부과, 안과, 치과, 외과, 정형외과<br>' +
                    '🚗 건물 내 주차 가능, 입원실 운영' +
                    '</div>'
                );

                // 4. 24시 이솔동물의료센터 (부산 사하구 하단동 534-7)
                var hosp3Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge">' +
                          '<span>🏥</span>' +
                          '<span>24시 이솔동물</span>' +
                          '<span class="badge-sub">24시 응급</span>' +
                          '</div>',
                    iconSize: [170, 36],
                    iconAnchor: [85, 36]
                });
                markers.hosp3 = L.marker([35.1017800, 128.9664500], { icon: hosp3Icon }).addTo(map);
                markers.hosp3.bindPopup(
                    '<div style="min-width:220px;">' +
                    '<b style="font-size:14px;color:#dc2626;">🏥 24시 이솔동물의료센터</b><br>' +
                    '📍 <b>주소:</b> 부산 사하구 하단동 534-7<br>' +
                    '📞 <b>직통:</b> <a href="tel:0517117566" style="color:#0284c7;font-weight:bold;">051-711-7566 (전화걸기)</a><br>' +
                    '🩺 <b>진료:</b> 만성/호르몬/항암 내과, 슬개골/정형 외과, 24시 응급<br>' +
                    '🚗 건물 뒤편 11면 주차장' +
                    '</div>'
                );

                // 5. 23시 하단오거리동물병원 (부산 사하구 하단동 617-10)
                var hosp4Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge">' +
                          '<span>🏥</span>' +
                          '<span>23시 하단오거리</span>' +
                          '<span class="badge-sub">24시 응급</span>' +
                          '</div>',
                    iconSize: [170, 36],
                    iconAnchor: [85, 36]
                });
                markers.hosp4 = L.marker([35.1051500, 128.9617800], { icon: hosp4Icon }).addTo(map);
                markers.hosp4.bindPopup(
                    '<div style="min-width:220px;">' +
                    '<b style="font-size:14px;color:#dc2626;">🏥 23시 하단오거리동물병원</b><br>' +
                    '📍 <b>주소:</b> 부산 사하구 하단동 617-10<br>' +
                    '📞 <b>직통:</b> <a href="tel:0512917582" style="color:#0284c7;font-weight:bold;">051-291-7582 (전화걸기)</a><br>' +
                    '🐾 <b>진료 대상:</b> 개, 고양이, 토끼, 고슴도치, 페릿, 파충류 등<br>' +
                    '🚗 건물 뒷편 10대 주차 가능' +
                    '</div>'
                );

                // 6. 이로운동물병원 (부산 강서구 명지동 3331-7) - 주간 일반 진료
                var hosp5Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge-regular">' +
                          '<span>🏥</span>' +
                          '<span>이로운동물병원</span>' +
                          '<span class="badge-sub-regular">주간 진료</span>' +
                          '</div>',
                    iconSize: [175, 36],
                    iconAnchor: [87, 36]
                });
                markers.hosp5 = L.marker([35.1047010, 128.9223980], { icon: hosp5Icon }).addTo(map);
                markers.hosp5.bindPopup(
                    '<div style="min-width:230px;">' +
                    '<b style="font-size:14px;color:#059669;">🏥 이로운동물병원</b> <span style="background:#ecfdf5;color:#059669;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:bold;">주간 진료</span><br>' +
                    '📍 <b>주소:</b> 부산 강서구 명지동 3331-7 (명지국제11로 35)<br>' +
                    '📞 <b>직통:</b> <a href="tel:050714197578" style="color:#0284c7;font-weight:bold;">0507-1419-7578 (전화걸기)</a><br>' +
                    '⏰ <b>진료시간:</b><br>' +
                    '• 월~금: 09:00 - 19:00 (휴게 13~14시 / 마감 18:00)<br>' +
                    '• 토: 09:00 - 14:00 (접수마감 13:00)<br>' +
                    '• 일: 정기휴무 (매주 일요일)<br>' +
                    '🚗 <b>주차:</b> 뒷쪽 골목길 주차' +
                    '</div>'
                );

                // 7. 양산에스동물메디컬센터 (경남 양산시 물금읍 증산리 1776-2) - 주간·연중무휴 전문 메디컬센터
                var hosp6Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge-special">' +
                          '<span>🏥</span>' +
                          '<span>양산에스메디컬</span>' +
                          '<span class="badge-sub-special">주간·연중무휴</span>' +
                          '</div>',
                    iconSize: [185, 36],
                    iconAnchor: [92, 36]
                });
                markers.hosp6 = L.marker([35.3084850, 129.0083750], { icon: hosp6Icon }).addTo(map);
                markers.hosp6.bindPopup(
                    '<div style="min-width:250px;max-width:320px;">' +
                    '<b style="font-size:14px;color:#7c3aed;">🏥 양산에스동물메디컬센터</b> <span style="background:#f5f3ff;color:#7c3aed;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:bold;">주간·연중무휴</span><br>' +
                    '📍 <b>주소:</b> 경남 양산시 물금읍 증산리 1776-2 (증산역로 174)<br>' +
                    '📞 <b>직통:</b> <a href="tel:0553822475" style="color:#0284c7;font-weight:bold;">055-382-2475 (전화걸기)</a><br>' +
                    '⏰ <b>진료시간:</b><br>' +
                    '• 월~일(연중무휴): 10:00 - 19:30 (휴게 13:30~14:30 / 마감 13:00, 19:00)<br>' +
                    '<span style="color:#dc2626;font-size:11px;">※ 18시 이후 내원 시 사전 유선 문의 필수</span><br>' +
                    '🩺 <b>특화진료:</b> 노령동물 통합(심장/신장/종양), 최소침습수술(내시경/복강경), 고양이친화, 암센터협진 CT/줄기세포, 보이는 수술실(CCTV)<br>' +
                    '🐾 <b>진료 대상:</b> 개, 고양이 (입원실 운영)<br>' +
                    '🚗 <b>주차:</b> 건물 뒷편 주차 가능' +
                    '</div>'
                );

                // 8. 힐스동물병원 (경남 양산시 물금읍 범어리 2799-4) - 주간 일반 진료
                var hosp7Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge-regular">' +
                          '<span>🏥</span>' +
                          '<span>양산 힐스동물병원</span>' +
                          '<span class="badge-sub-regular">주간 진료</span>' +
                          '</div>',
                    iconSize: [185, 36],
                    iconAnchor: [92, 36]
                });
                markers.hosp7 = L.marker([35.3369529, 129.0144324], { icon: hosp7Icon }).addTo(map);
                markers.hosp7.bindPopup(
                    '<div style="min-width:250px;max-width:320px;">' +
                    '<b style="font-size:14px;color:#059669;">🏥 힐스동물병원</b> <span style="background:#ecfdf5;color:#059669;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:bold;">주간 진료</span><br>' +
                    '📍 <b>주소:</b> 경남 양산시 물금읍 범어리 2799-4 1층 (신주3길 8)<br>' +
                    '📞 <b>직통:</b> <a href="tel:0553888275" style="color:#0284c7;font-weight:bold;">055-388-8275 (전화걸기)</a><br>' +
                    '⏰ <b>진료시간:</b><br>' +
                    '• 월~금: 09:00 - 18:30 (휴게 13:00~14:00)<br>' +
                    '• 토요일: 09:00 - 17:00<br>' +
                    '• 일요일: 정기휴무<br>' +
                    '<span style="color:#dc2626;font-size:11px;">※ 수술 이외의 진료는 사전 예약 불가 (현장 접수 순)</span><br>' +
                    '🩺 <b>진료과목:</b> 피부과, 내과, 안과, 치과, 영상의학과, 예방의학과, 외과, 정형외과 등<br>' +
                    '📋 <b>특이사항:</b> 메리츠화재 펫보험 간편 청구 지원, 미용실 운영, 지역화폐/간편결제<br>' +
                    '🚗 <b>주차:</b> 바로 옆 임시공영주차장 및 골목길 주차 매우 편리' +
                    '</div>'
                );

                // 9. 24시 리본동물의료센터 (부산 동래구 명륜동 506-13) - 24시간 응급 진료
                var hosp8Icon = L.divIcon({
                    className: '',
                    html: '<div class="custom-hosp-badge">' +
                          '<span>🏥</span>' +
                          '<span>24시 리본동물의료센터</span>' +
                          '<span class="badge-sub">24시 응급</span>' +
                          '</div>',
                    iconSize: [195, 36],
                    iconAnchor: [97, 36]
                });
                markers.hosp8 = L.marker([35.2029100, 129.0809700], { icon: hosp8Icon }).addTo(map);
                markers.hosp8.bindPopup(
                    '<div style="min-width:260px;max-width:330px;">' +
                    '<b style="font-size:14px;color:#dc2626;">🏥 24시 리본동물의료센터</b> <span style="background:#fee2e2;color:#dc2626;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:bold;">24시 응급</span><br>' +
                    '📍 <b>주소:</b> 부산 동래구 명륜동 506-13 동림빌딩 2층 (충렬대로 194)<br>' +
                    '📞 <b>직통:</b> <a href="tel:0517110006" style="color:#0284c7;font-weight:bold;">051-711-0006 (전화걸기)</a><br>' +
                    '⏰ <b>진료시간:</b> 24시간 연중무휴 응급 진료 (정규 09:00~19:00 예약우선제)<br>' +
                    '🩺 <b>특화진료:</b> 영남권 최초 3.0T MRI·64채널 CT, 무균양압수술실, 신장투석센터(CCRT), 종양·중증내과, ISFM GOLD 고양이전용진료동, 안과·치과 특화, 24시 ICU<br>' +

                    '<b style="font-size:14px;color:#dc2626;">🏥 닥터펫동물의료센터</b> <span style="background:#fee2e2;color:#dc2626;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:bold;">24시 응급</span><br>' +
                    '📍 <b>주소:</b> 부산 부산진구 개금동 511-1 (가야대로 451 개금메디칼빌딩)<br>' +
                    '📞 <b>직통:</b> <a href="tel:0518918575" style="color:#0284c7;font-weight:bold;">051-891-8575 (전화걸기)</a><br>' +
                    '⏰ <b>진료시간:</b> 24시간 연중무휴 응급 진료<br>' +

                );

                );

                var loader = document.getElementById('loading-indicator');
                if (loader) loader.style.display = 'none';

                setTimeout(function() {
                    if (map) { map.invalidateSize(); }
                }, 250);
            } catch (e) {
                console.error("Map Engine error: " + e);

        function focusLocation(key) {
            if (!map) return;
            if (key === 'car' && markers.car) {
                map.flyTo([carLat, carLng], 15, { duration: 1 });
                markers.car.openPopup();
            } else if (key === 'hosp1' && markers.hosp1) {

            } else if (key === 'hosp2' && markers.hosp2) {
                map.flyTo([35.1818200, 129.0823500], 16, { duration: 1 });
                markers.hosp2.openPopup();
            } else if (key === 'hosp3' && markers.hosp3) {
                map.flyTo([35.1017800, 128.9664500], 16, { duration: 1 });
                markers.hosp3.openPopup();
            } else if (key === 'hosp4' && markers.hosp4) {

                map.flyTo([35.1047010, 128.9223980], 16, { duration: 1 });
                markers.hosp5.openPopup();
            } else if (key === 'hosp6' && markers.hosp6) {
                map.flyTo([35.3084850, 129.0083750], 16, { duration: 1 });
                markers.hosp6.openPopup();
            } else if (key === 'hosp7' && markers.hosp7) {
                map.flyTo([35.3369529, 129.0144324], 16, { duration: 1 });
                markers.hosp7.openPopup();
            } else if (key === 'hosp8' && markers.hosp8) {
                map.flyTo([35.2029100, 129.0809700], 16, { duration: 1 });
                markers.hosp8.openPopup();
            } else if (key === 'hosp9' && markers.hosp9) {
                map.flyTo([35.1535770, 129.0216840], 16, { duration: 1 });
                markers.hosp9.openPopup();
            } else if (key === 'hosp10' && markers.hosp10) {
                map.flyTo([35.0811360, 128.8772500], 16, { duration: 1 });
                markers.hosp10.openPopup();
            } else {
                var group = L.featureGroup([markers.car, markers.hosp1, markers.hosp2, markers.hosp3, markers.hosp4, markers.hosp5, markers.hosp6, markers.hosp7, markers.hosp8, markers.hosp9, markers.hosp10]);
                map.fitBounds(group.getBounds().pad(0.15), { duration: 1 });
            }
        }

        function updateCarGps(lat, lng) {
            carLat = lat;
            carLng = lng;
            if (markers.car) {
                markers.car.setLatLng([lat, lng]);
            }
        }

        window.addEventListener('DOMContentLoaded', initMapEngine);
        window.addEventListener('load', initMapEngine);
        setTimeout(initMapEngine, 200);
    </script>
</body>
</html>
